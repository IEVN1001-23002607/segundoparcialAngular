<div class="max-w-4xl mx-auto p-8 grid grid-cols-2 gap-8 font-sans">
  
  
  <div class="border-2 border-gray-300 p-4 rounded-lg">
    <h2 class="text-center font-bold mb-4">Datos Personales</h2>

    <form [formGroup]="formulario" (ngSubmit)="imprimir()" class="space-y-4">
      
      
      <div class="flex items-center gap-2">
        <label class="w-24">Nombre</label>
        <input type="text" formControlName="nombre" class="border p-1 w-full rounded">
      </div>
      <div class="flex items-center gap-2">
        <label class="w-24">Apaterno</label>
        <input type="text" formControlName="apaterno" class="border p-1 w-full rounded">
      </div>
      <div class="flex items-center gap-2">
        <label class="w-24">Amaterno</label>
        <input type="text" formControlName="amaterno" class="border p-1 w-full rounded">
      </div>

      
      <h3 class="text-center font-bold mt-4">Fecha de nacimiento</h3>
      <div class="flex gap-2 justify-center">
        <div class="text-center">
          <label class="block text-sm">Dia</label>
          <input type="number" formControlName="dia" class="border p-1 w-16 rounded">
        </div>
        <div class="text-center">
          <label class="block text-sm">Mes</label>
          <input type="number" formControlName="mes" class="border p-1 w-16 rounded">
        </div>
        <div class="text-center">
          <label class="block text-sm">Año</label>
          <input type="number" formControlName="anio" class="border p-1 w-20 rounded">
        </div>
      </div>

      
      <div class="mt-4">
        <label class="block font-bold">sexo</label>
        <div>
          <input type="radio" value="Masculino" formControlName="sexo" id="masculino">
          <label for="masculino" class="ml-2">Masculino</label>
        </div>
        <div>
          <input type="radio" value="Femenino" formControlName="sexo" id="femenino">
          <label for="femenino" class="ml-2">Femenino</label>
        </div>
      </div>

      
      <button type="submit" class="mt-6 border-4 border-black px-6 py-2 font-bold w-full hover:bg-gray-100">
  imprimir
</button>

    </form>
  </div>

  
  <div *ngIf="resultado" class="flex flex-col items-center justify-center space-y-4">
    <h2 class="text-2xl">
      Hola <span class="font-bold italic">{{ resultado.nombreCompleto }}</span>
    </h2>
    
    <p class="text-xl">Tienes <strong>{{ resultado.edad }}</strong> años</p>
    
    <p class="text-xl">tu signo zodiacal</p>
    
    <div class="flex items-center gap-4">
      <p class="text-xl">Es {{ resultado.signoTexto | lowercase }}</p>
      
      
      <div class="w-32 h-32 bg-blue-700 rounded-full flex items-center justify-center text-white overflow-hidden shadow-lg">
        <img [src]="resultado.signoImagen" [alt]="resultado.signoTexto" class="object-cover w-full h-full">
      </div>
    </div>
  </div>

</div>
